
services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: career_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app       # Live-reload: host changes sync into container
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password123@db:5432/career_db
      - LANGGRAPH_CHECKPOINT_URL=postgresql://admin:password123@db:5432/career_db
      - NEO4J_URI=bolt://neo4j:7687
      - FRONTEND_URL=http://localhost:3000
    # Override CMD for dev: use --reload for hot-reloading
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - db
      - neo4j
    restart: unless-stopped

  # ── Frontend (React + Vite via Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Empty string → the Nginx proxy handles routing to backend
        VITE_API_URL: ""
    container_name: career_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── PostgreSQL + pgvector ───────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: career_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=career_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Neo4j (Graph Database) ─────────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: career_neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # ── pgAdmin (Database UI) ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: career_partner_admin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  # ── Stripe CLI (Local Webhook Testing) ─────────────────────────────
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: career_stripe_cli
    profiles: [stripe]   # Only start with: docker compose --profile stripe up
    env_file:
      - ./backend/.env
    entrypoint: [ "sh", "-c", "stripe listen --api-key $$STRIPE_SECRET_KEY --forward-to http://backend:8000/api/payment/webhook" ]
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data: