server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Final-boss performance optimizations for large files
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300;
    send_timeout 300;
    client_max_body_size 512M;

    # Force binary stream for ONNX to prevent any processing
    types {
        application/javascript mjs;
        application/octet-stream onnx;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Direct streaming for models (No buffering)
    location ~* \.onnx$ {
        add_header Cache-Control "public, no-transform, max-age=31536000";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        # Disable buffering for large models
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
